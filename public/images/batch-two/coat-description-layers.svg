<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="#f5f7f2"/><g font-family="Arial,sans-serif" fill="#193f35"><text x="50" y="62" font-size="36" font-weight="bold">Read a coat name one part at a time</text><text x="50" y="104" font-size="23">Example: blue silver classic tabby with white</text><rect x="50" y="140" width="1100" height="106" rx="16" fill="#e1e9dd"/><circle cx="99" cy="193" r="26" fill="#76838b" stroke="#193f35" stroke-width="2"/><text x="150" y="185" font-size="27" font-weight="bold">Blue</text><text x="150" y="220" font-size="21">Color term</text><text x="540" y="204" font-size="24">Gray-looking color</text><rect x="50" y="265" width="1100" height="106" rx="16" fill="#e1e9dd"/><circle cx="99" cy="318" r="26" fill="#d1d9d7" stroke="#193f35" stroke-width="2"/><text x="150" y="310" font-size="27" font-weight="bold">Silver</text><text x="150" y="345" font-size="21">Coat background</text><text x="540" y="329" font-size="24">Pale ground beneath markings</text><rect x="50" y="390" width="1100" height="106" rx="16" fill="#e1e9dd"/><circle cx="99" cy="443" r="26" fill="#ae947a" stroke="#193f35" stroke-width="2"/><text x="150" y="435" font-size="27" font-weight="bold">Classic tabby</text><text x="150" y="470" font-size="21">Pattern term</text><text x="540" y="454" font-size="24">Broad body markings</text><rect x="50" y="515" width="1100" height="106" rx="16" fill="#e1e9dd"/><circle cx="99" cy="568" r="26" fill="#ffffff" stroke="#193f35" stroke-width="2"/><text x="150" y="560" font-size="27" font-weight="bold">With white</text><text x="150" y="595" font-size="21">White areas</text><text x="540" y="579" font-size="24">An additional coat feature</text><text x="50" y="720" font-size="20">Wise Maine Coon • Simplified illustration, not to scale</text></g></svg>