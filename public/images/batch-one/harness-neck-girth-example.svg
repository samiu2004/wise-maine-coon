<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="580" viewBox="0 0 1000 580" role="img" aria-labelledby="title desc"><title id="title">Two measurements, one sizing decision</title><desc id="desc">Hypothetical 19 inch girth and 11 inch neck: Medium fails girth and Large fails neck in the RC Pets Adventure Kitty chart. Schematic only.</desc><rect width="1000" height="580" rx="22" fill="#f4f6ef"/><g font-family="Arial,sans-serif" fill="#173b32"><text x="45" y="65" font-size="32" font-weight="bold">Check neck and girth separately</text><path d="M90 240 L130 218 L139 154 L175 180 Q225 171 245 223 Q355 176 480 227 L575 249 Q635 150 704 210" fill="none" stroke="#667d6c" stroke-width="10" stroke-linecap="round"/><path d="M160 255 L165 341 L204 341 L215 260 M500 270 L514 341 L551 341 L566 265" fill="none" stroke="#667d6c" stroke-width="10"/><ellipse cx="229" cy="245" rx="19" ry="57" fill="none" stroke="#9b6728" stroke-width="6"/><ellipse cx="300" cy="255" rx="24" ry="70" fill="none" stroke="#28694e" stroke-width="6"/><text x="100" y="395" font-size="25">Neck: 11 in</text><text x="320" y="395" font-size="25">Girth: 19 in</text><rect x="730" y="145" width="225" height="250" rx="16" fill="#fff"/><text x="752" y="185" font-size="24" font-weight="bold">Chart example</text><text x="752" y="230" font-size="19">Medium: girth too big</text><text x="752" y="270" font-size="19">Large: neck too small</text><text x="752" y="320" font-size="19">Neither covers both.</text><text x="45" y="465" font-size="23">Ask about another adjustment range. Do not leave a loop loose.</text><text x="45" y="515" font-size="18">Illustration is not a harness fitting instruction. Follow the exact model’s diagram.</text><text x="45" y="547" font-size="17">Hypothetical cat; RC Pets chart example. Not to scale.</text></g></svg>