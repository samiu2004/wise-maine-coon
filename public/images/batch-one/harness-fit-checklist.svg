<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Harness fit checklist</title><desc id="desc">Four steps: record measurements, use the exact model chart, follow its fitting instructions and introduce indoors gradually.</desc><rect width="1200" height="720" fill="#f5f7f2"/><g font-family="Arial,sans-serif" fill="#183f35"><text x="60" y="78" font-size="38" font-weight="bold">A breed label is not a harness size</text><text x="60" y="121" font-size="23">Use the individual cat and the exact model's instructions</text></g><g fill="#d6e4d6"><rect x="60" y="170" width="520" height="180" rx="18"/><rect x="620" y="170" width="520" height="180" rx="18"/><rect x="60" y="385" width="520" height="180" rx="18"/><rect x="620" y="385" width="520" height="180" rx="18"/></g><g font-family="Arial,sans-serif" fill="#183f35"><text x="88" y="221" font-size="27" font-weight="bold">1. Record measurements</text><text x="88" y="271" font-size="23">Neck / chest as instructed</text><text x="88" y="311" font-size="23">Record units and measurement date</text><text x="648" y="221" font-size="27" font-weight="bold">2. Check the exact model</text><text x="648" y="271" font-size="23">Compare every required measurement</text><text x="648" y="311" font-size="23">“Large” varies between products</text><text x="88" y="436" font-size="27" font-weight="bold">3. Follow fit instructions</text><text x="88" y="486" font-size="23">Check movement and strap position</text><text x="88" y="526" font-size="23">No escape-proof guarantee</text><text x="648" y="436" font-size="27" font-weight="bold">4. Introduce indoors</text><text x="648" y="486" font-size="23">Proceed gradually and supervise</text><text x="648" y="526" font-size="23">Stop if the cat is uncomfortable</text><text x="60" y="630" font-size="24">Harness walking is optional. Consider the individual cat's welfare.</text><text x="60" y="685" font-size="17">Wise Maine Coon • Original illustration</text></g></svg>
