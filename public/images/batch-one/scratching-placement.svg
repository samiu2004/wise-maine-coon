<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Offer a scratcher where the cat already scratches</title><desc id="desc">An example room layout places an upright scratcher beside a sofa and a horizontal scratcher near a resting area. Match the cat's observed preferences.</desc><rect width="1200" height="720" fill="#f5f7f2"/><g fill="#183f35" font-family="Arial,sans-serif"><text x="60" y="78" font-size="37" font-weight="bold">Make the alternative easy to reach</text><text x="60" y="118" font-size="22">Example placement • Adapt to your cat and room</text></g><g fill="#d6e4d6" stroke="#183f35" stroke-width="5"><rect x="100" y="210" width="430" height="220" rx="35"/><rect x="125" y="240" width="380" height="155" rx="25"/><rect x="590" y="320" width="95" height="110" rx="12"/><ellipse cx="920" cy="290" rx="130" ry="75"/><rect x="790" y="425" width="190" height="80" rx="10"/></g><g font-family="Arial,sans-serif" fill="#183f35" font-size="25"><text x="277" y="335">Sofa</text><text x="550" y="261">Upright post</text><text x="843" y="299">Resting area</text><text x="738" y="558">Horizontal scratcher</text><text x="90" y="486" font-size="22">Start beside the targeted furniture.</text><text x="60" y="625" font-size="23">Match orientation and texture. Reward use. Do not force paws onto the post.</text><text x="60" y="685" font-size="17">Wise Maine Coon • Original illustration</text></g></svg>
