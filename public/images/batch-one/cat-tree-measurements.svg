<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Measure usable space, not just height</title><desc id="desc">A schematic cat tree with separate labels for height, perch space and floor footprint. Not drawn to scale.</desc><rect width="1200" height="720" fill="#f5f7f2"/><g fill="#183f35" font-family="Arial,sans-serif"><text x="60" y="78" font-size="38" font-weight="bold">Measure the space your cat will use</text><text x="60" y="119" font-size="22">Cat-tree fit worksheet • Schematic, not to scale</text></g><g stroke="#183f35" stroke-width="7" fill="#d6e4d6"><rect x="420" y="560" width="300" height="38" rx="8"/><rect x="495" y="220" width="42" height="340"/><rect x="607" y="400" width="42" height="160"/><rect x="390" y="192" width="250" height="42" rx="14"/><rect x="565" y="368" width="205" height="42" rx="14"/></g><g stroke="#af7427" stroke-width="5" fill="none"><path d="M340 192V598M322 192h36M322 598h36M402 167h224M402 154v26M626 154v26M420 630h300M420 616v28M720 616v28"/></g><g fill="#183f35" font-family="Arial,sans-serif" font-size="25"><text x="70" y="353">Overall height</text><text x="70" y="386" font-size="19">Does not establish perch fit</text><text x="720" y="210">Usable perch space</text><text x="720" y="244" font-size="19">Check inside rims and padding</text><text x="460" y="675">Base footprint</text><text x="60" y="685" font-size="17">Wise Maine Coon • Original illustration</text></g></svg>
