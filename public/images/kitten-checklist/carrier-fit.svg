<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="t d"><title id="t">Check carrier fit</title><desc id="d">Diagram of interior height, usable floor space and the door opening. Confirm your kitten can stand, turn and lie down.</desc><rect width="900" height="430" rx="24" fill="#f5f1e9"/><text x="450" y="55" text-anchor="middle" font-family="sans-serif" font-size="32" fill="#283f3d">Check the space inside</text><rect x="180" y="100" width="540" height="230" rx="55" fill="#fffdf8" stroke="#657c72" stroke-width="8"/><path d="M235 127v175m-14-160 14-15 14 15m-28 145 14 15 14-15M300 285h290m-275-14-15 14 15 14m260-28 15 14-15 14" stroke="#ad7252" stroke-width="5" fill="none"/><rect x="605" y="150" width="100" height="150" rx="10" fill="#d9e5df" stroke="#657c72" stroke-width="5"/><text x="310" y="140" font-family="sans-serif" font-size="22" fill="#283f3d">Interior height</text><text x="340" y="270" font-family="sans-serif" font-size="22" fill="#283f3d">Usable floor space</text><text x="655" y="350" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#283f3d">Door opening</text><text x="450" y="398" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#283f3d">Your kitten should be able to stand, turn and lie down.</text></svg>
